include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

#
# Start custom overrides.
#

.setup-extension: &setup-extension
  # https://docs.gitlab.com/ee/ci/jobs/index.html#pre-collapse-sections
  - echo -e "\e[0Ksection_start:`date +%s`:my_first_section[collapsed=true]\r\e[0KInstall PHP Extensions"
  - >
    if [ "$REDIS_INTERFACE" == "PhpRedis" ]; then
      docker-php-ext-enable msgpack redis
    fi
  - >
    if [ "$REDIS_INTERFACE" == "Relay" ]; then
      docker-php-ext-enable msgpack
      RELAY_VERSION="$(curl -fsSL https://builds.r2.relay.so/meta/latest)"
      RELAY_PHP="$(php-config --version | cut -d. -f1,2)"
      RELAY_INI_DIR="$(php-config --ini-dir)"
      RELAY_EXT_DIR="$(php-config --extension-dir)"
      RELAY_DISTRO="$(grep -E '^ID=' /etc/os-release | cut -d = -f 2)"
      RELAY_SSL_SUFFIX="$(php -r 'echo OPENSSL_VERSION_NUMBER < 0x30000000 ? "" : "+libssl3";')"
      case "$(arch)" in
        arm64) RELAY_ARCH="aarch64" ;;
        amd64|x86_64) RELAY_ARCH="x86-64" ;;
        *) RELAY_ARCH="$(arch)" ;;
      esac
      RELAY_ARTIFACT=""
      for RELAY_CANDIDATE_DISTRO in "$RELAY_DISTRO" debian; do
        RELAY_CANDIDATE="https://builds.r2.relay.so/${RELAY_VERSION}/relay-${RELAY_VERSION}-php${RELAY_PHP}-${RELAY_CANDIDATE_DISTRO}-${RELAY_ARCH}${RELAY_SSL_SUFFIX}.tar.gz";
        if curl -fsSIL -o /dev/null "$RELAY_CANDIDATE"; then RELAY_ARTIFACT="$RELAY_CANDIDATE"; break; fi;
      done
      test -n "$RELAY_ARTIFACT"
      RELAY_TMP_DIR="$(mktemp -d)"
      echo "Installing Relay ${RELAY_VERSION} from ${RELAY_ARTIFACT}"
      curl -fsSL "$RELAY_ARTIFACT" | tar -xz --strip-components=1 -C "$RELAY_TMP_DIR"
      sed -i "s/00000000-0000-0000-0000-000000000000/$(cat /proc/sys/kernel/random/uuid)/" "$RELAY_TMP_DIR/relay-pkg.so"
      cp "$RELAY_TMP_DIR/relay-pkg.so" "$RELAY_EXT_DIR/relay.so"
      printf '%s\n' 'extension=relay' 'relay.maxmemory = 64M' 'relay.eviction_policy = lru' 'relay.environment = production' > "$RELAY_INI_DIR/relay.ini"
    fi
  - echo -e "\e[0Ksection_end:`date +%s`:my_first_section\r\e[0K"

variables:
  _SHOW_ENVIRONMENT_VARIABLES: 1
  REDIS_HOST: redis
  REDIS_INTERFACE: PhpRedis
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  # Concurrency can not be enabled as environment variables are not passed
  # through
  _PHPUNIT_CONCURRENT: 0

.composer-base:
  before_script:
    - composer require --dev predis/predis --no-update

# For now, use Predis by default as this avoids issues with packages.
.phpunit-base:
  variables:
    REDIS_INTERFACE: Predis
  before_script:
    - *setup-extension
  services:
    - !reference [ .with-database ]
    - !reference [ .with-chrome ]
    - name: redis:7
      alias: redis
      command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--maxmemory", "100M"]

phpunit:
  parallel:
    matrix:
      - REDIS_INTERFACE:
          - PhpRedis
          - Predis
          - Relay

phpunit (previous minor):
  extends: .phpunit-base

phpunit (previous major):
  extends: .phpunit-base

phpunit (next minor):
  extends: .phpunit-base

phpunit (valkey):
  extends: phpunit
  services:
    - !reference [ .with-database ]
    - !reference [ .with-chrome ]
    - name: valkey/valkey:8
      alias: redis
      command: [ "valkey-server", "--maxmemory-policy", "allkeys-lru", "--maxmemory", "100M" ]

pages:
  before_script:
    - mkdir docs
    - mv *.md docs
