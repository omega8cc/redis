services:
  cache.backend.redis:
    class: Drupal\redis\Cache\CacheBackendFactory
    arguments: ['@redis.factory', '@cache_tags.invalidator.checksum', '@serialization.phpserialize', '@service_container']

  redis.factory:
    class: Drupal\redis\ClientFactory

  redis.lock.factory:
    class: Drupal\redis\Lock\LockFactory
    arguments: ['@redis.factory', '@service_container']

  redis.flood.factory:
    class: Drupal\redis\Flood\FloodFactory
    arguments: ['@redis.factory', '@request_stack', '@service_container']

  queue.redis_reliable:
    class: Drupal\redis\Queue\ReliableQueueRedisFactory
    arguments: ['@redis.factory', '@settings']
    tags:
      - { name: queue_factory }

  queue.redis:
    class: Drupal\redis\Queue\QueueRedisFactory
    arguments: ['@redis.factory', '@settings']
    tags:
      - { name: queue_factory }
